name: Keep Render warm

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          set -u
          for i in 1 2 3; do
            if curl -sSf -m 50 https://qna-report.onrender.com/healthz; then
              echo
              echo "ok"
              exit 0
            fi
            echo "retry $i"
            sleep 5
          done
          echo "ping failed but not failing the job"
